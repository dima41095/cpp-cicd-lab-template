name: Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (тег образа) для отката'
        required: true
        default: 'latest'
      environment:
        description: 'Окружение для отката'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Convert repository name to lowercase
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      
      - name: Rollback to specified version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          ENV="${{ github.event.inputs.environment }}"
          IMAGE="ghcr.io/${{ env.REPO_LOWER }}:$VERSION"
          
          echo "=== ROLLBACK EXECUTION ===" > rollback.log
          echo "Rolling back to version: $VERSION" >> rollback.log
          echo "Environment: $ENV" >> rollback.log
          echo "Timestamp: $(date)" >> rollback.log
          
          docker pull $IMAGE
          
          if [ "$ENV" = "production" ]; then
            docker stop app-blue 2>/dev/null || true
            docker rm app-blue 2>/dev/null || true
            docker run -d --name app-blue -p 8080:8080 $IMAGE
            sleep 5
            curl --retry 5 --retry-delay 2 --fail http://localhost:8080/health || exit 1
            echo "Production rollback to $VERSION completed" >> rollback.log
          else
            docker stop staging-app 2>/dev/null || true
            docker rm staging-app 2>/dev/null || true
            docker run -d --name staging-app -p 8080:8080 $IMAGE
            sleep 5
            curl --retry 5 --retry-delay 2 --fail http://localhost:8080/health || exit 1
            echo "Staging rollback to $VERSION completed" >> rollback.log
          fi
      
      - name: Save rollback logs
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            docker logs app-blue > rollback_logs.txt 2>&1
          else
            docker logs staging-app > rollback_logs.txt 2>&1
          fi
      
      - name: Upload rollback logs
        uses: actions/upload-artifact@v4
        with:
          name: rollback-logs-${{ github.run_id }}
          path: rollback_logs.txt
